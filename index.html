```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SymptomSense - AI Symptom Checker</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons (replaces Lucide for standalone HTML) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- IMPORTANT: ADD YOUR API KEY HERE ---
        // Get a free key from: https://aistudio.google.com/app/apikey
        const apiKey = "AQ.Ab8RN6IWV-7jQlGTQTE6bJhX3s3YGS7aHyd6jH1jywhPM8j10w"; 

        // Exponential backoff retry logic
        const fetchWithRetry = async (url, options, maxRetries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

        const loadingMessages = [
            "Analyzing symptoms...",
            "Cross-referencing medical data...",
            "Evaluating potential causes...",
            "Formulating recommendations...",
            "Finalizing results..."
        ];

        function App() {
            const [symptoms, setSymptoms] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);
            const [loadingMessageIndex, setLoadingMessageIndex] = useState(0);

            const analyzeSymptoms = async () => {
                if (!apiKey || apiKey === "AQ.Ab8RN6IWV-7jQlGTQTE6bJhX3s3YGS7aHyd6jH1jywhPM8j10w") {
                    setError("API Key is missing. Please add your Gemini API Key to the code.");
                    return;
                }

                if (!symptoms.trim()) {
                    setError("Please describe your symptoms first.");
                    return;
                }

                setIsAnalyzing(true);
                setError(null);
                setResults(null);
                setLoadingMessageIndex(0);

                const intervalId = setInterval(() => {
                    setLoadingMessageIndex((prev) => Math.min(prev + 1, loadingMessages.length - 1));
                }, 2000);

                const systemPrompt = `You are an AI health assistant. The user will provide a list of symptoms or a description of how they are feeling. 
                Analyze the symptoms and provide a list of possible causes, sicknesses, or diseases. 
                Always include a mix of common/benign possibilities and more serious ones if applicable, but do not alarm the user unnecessarily.
                You MUST format your response as JSON according to the provided schema.`;

                const payload = {
                    contents: [{ parts: [{ text: symptoms }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                conditions: {
                                    type: "ARRAY",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            name: { type: "STRING" },
                                            likelihood: { type: "STRING" },
                                            description: { type: "STRING" },
                                            urgency: { type: "STRING" },
                                            advice: { type: "STRING" }
                                        }
                                    }
                                },
                                summary: { type: "STRING" }
                            }
                        }
                    }
                };

                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                    const data = await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (textResponse) {
                        const parsedResults = JSON.parse(textResponse);
                        setResults(parsedResults);
                    } else {
                        throw new Error("No response received from the analysis engine.");
                    }
                } catch (err) {
                    console.error("Analysis failed:", err);
                    setError("Failed to analyze symptoms. Ensure your API key is correct and try again.");
                } finally {
                    clearInterval(intervalId);
                    setIsAnalyzing(false);
                }
            };

            const handleReset = () => {
                setSymptoms('');
                setResults(null);
                setError(null);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const getUrgencyColor = (urgency) => {
                const u = urgency?.toLowerCase() || '';
                if (u.includes('emergency')) return 'bg-red-100 text-red-800 border-red-200';
                if (u.includes('doctor') || u.includes('consult')) return 'bg-amber-100 text-amber-800 border-amber-200';
                return 'bg-emerald-100 text-emerald-800 border-emerald-200';
            };

            const getLikelihoodBadge = (likelihood) => {
                const l = likelihood?.toLowerCase() || '';
                if (l === 'high') return <span className="px-2 py-1 text-xs font-semibold bg-blue-100 text-blue-800 rounded-full">High Match</span>;
                if (l === 'medium') return <span className="px-2 py-1 text-xs font-semibold bg-gray-100 text-gray-800 rounded-full">Medium Match</span>;
                return <span className="px-2 py-1 text-xs font-semibold bg-gray-50 text-gray-500 rounded-full border">Low Match</span>;
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900 pb-48">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
                        <div className="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-2 text-indigo-600">
                                <i className="ph ph-stethoscope text-3xl"></i>
                                <h1 className="text-xl font-bold tracking-tight">Symptom<span className="text-slate-800">Sense</span></h1>
                            </div>
                            <div className="hidden sm:flex items-center gap-1 text-xs text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">
                                <i className="ph ph-activity text-sm"></i> AI-Powered Analysis
                            </div>
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto px-4 mt-8 space-y-6">
                        <div className="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg flex gap-3 items-start">
                            <i className="ph-fill ph-warning text-amber-600 text-2xl mt-0.5 shrink-0"></i>
                            <div className="text-sm text-amber-900">
                                <strong>Medical Disclaimer:</strong> This application uses Artificial Intelligence to provide informational suggestions based on the symptoms you enter. <strong>It is NOT a substitute for professional medical advice, diagnosis, or treatment.</strong> If you are experiencing a medical emergency, please call your local emergency services immediately.
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-4 sm:p-6 border-b border-slate-100 bg-slate-50/50 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                <div>
                                    <h2 className="text-lg font-semibold flex items-center gap-2">
                                        <i className="ph-fill ph-heartbeat text-indigo-500 text-xl"></i>
                                        How are you feeling today?
                                    </h2>
                                    <p className="text-slate-500 text-sm mt-1">
                                        Describe your symptoms in detail. Mention when they started and their severity.
                                    </p>
                                </div>
                                {symptoms.trim() && !results && (
                                    <button 
                                        onClick={handleReset}
                                        className="text-sm text-slate-500 hover:text-slate-700 font-medium transition-colors self-start sm:self-center"
                                    >
                                        Clear text
                                    </button>
                                )}
                            </div>
                            <div className="p-4 sm:p-6 space-y-4">
                                <textarea
                                    className={`w-full h-28 sm:h-32 p-4 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all resize-none ${
                                        results ? 'bg-slate-50 text-slate-500 border-slate-200' : 'bg-white text-slate-700 border-slate-300'
                                    }`}
                                    placeholder="e.g., I've had a throbbing headache on the right side of my head since yesterday morning, accompanied by mild nausea..."
                                    value={symptoms}
                                    onChange={(e) => setSymptoms(e.target.value)}
                                    disabled={isAnalyzing || results}
                                />
                                
                                {error && (
                                    <div className="text-red-600 text-sm flex items-center gap-2">
                                        <i className="ph ph-warning-circle text-lg"></i> {error}
                                    </div>
                                )}

                                {!results && (
                                    <button
                                        onClick={analyzeSymptoms}
                                        disabled={isAnalyzing || !symptoms.trim()}
                                        className={`w-full py-3.5 px-4 rounded-xl text-white font-medium flex items-center justify-center gap-2 transition-all ${
                                            isAnalyzing || !symptoms.trim() 
                                                ? 'bg-indigo-300 cursor-not-allowed' 
                                                : 'bg-indigo-600 hover:bg-indigo-700 shadow-md hover:shadow-lg active:scale-[0.99]'
                                        }`}
                                    >
                                        {isAnalyzing ? (
                                            <>
                                                <i className="ph ph-spinner animate-spin text-xl"></i>
                                                {loadingMessages[loadingMessageIndex]}
                                            </>
                                        ) : (
                                            <>
                                                Analyze Symptoms <i className="ph ph-caret-right text-xl"></i>
                                            </>
                                        )}
                                    </button>
                                )}
                            </div>
                        </div>

                        {results && (
                            <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                <div className="bg-indigo-50 border border-indigo-100 p-5 rounded-2xl flex gap-3 items-start">
                                    <i className="ph-fill ph-info text-indigo-600 text-2xl mt-0.5 shrink-0"></i>
                                    <div>
                                        <h3 className="font-semibold text-indigo-900 mb-1">AI Summary</h3>
                                        <p className="text-sm text-indigo-800 leading-relaxed">{results.summary}</p>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <h3 className="font-bold text-xl text-slate-800 px-1">Possible Conditions</h3>
                                    
                                    {results.conditions?.map((condition, index) => (
                                        <div key={index} className="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm hover:shadow-md transition-shadow">
                                            <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-4 mb-4">
                                                <div>
                                                    <h4 className="text-lg font-bold text-slate-900 mb-2">{condition.name}</h4>
                                                    <div className="flex flex-wrap items-center gap-2">
                                                        {getLikelihoodBadge(condition.likelihood)}
                                                        <span className={`px-2 py-1 text-xs font-medium rounded-full border ${getUrgencyColor(condition.urgency)}`}>
                                                            {condition.urgency}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div className="space-y-4 text-sm text-slate-600">
                                                <p className="leading-relaxed">
                                                    <strong className="text-slate-800 font-semibold">Description:</strong> {condition.description}
                                                </p>
                                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                    <strong className="text-slate-800 font-semibold block mb-1">Recommended Action:</strong> 
                                                    {condition.advice}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="pt-6 pb-2">
                                    <button
                                        onClick={handleReset}
                                        className="w-full sm:w-auto mx-auto flex items-center justify-center gap-2 py-3.5 px-8 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-all shadow-md hover:shadow-lg active:scale-[0.99]"
                                    >
                                        <i className="ph ph-arrows-clockwise text-xl"></i>
                                        Start New Analysis
                                    </button>
                                </div>
                            </div>
                        )}

                        {!results && !isAnalyzing && (
                            <div className="text-center py-12 px-4 text-slate-400">
                                <i className="ph ph-question text-6xl mx-auto mb-4 text-slate-300 block"></i>
                                <p className="max-w-sm mx-auto text-sm sm:text-base">
                                    Enter your symptoms above to receive an AI-generated list of potential conditions and self-care recommendations.
                                </p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
